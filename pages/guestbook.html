<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방명록 - nbh의 갠홈</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="container">

    <div class="banner">
      <div class="banner-title">nbh</div>
      <div class="banner-subtitle">B급 개발자의 아지트</div>
    </div>

    <div class="typing-bar">
      <span class="tb-prompt">&gt;_&nbsp;</span>
      <span class="tb-host">nbh</span>
      <span class="tb-dollar">$&nbsp;</span>
      <span class="tb-cmd" id="tb-cmd"></span>
      <span class="tb-output" id="tb-output"></span>
      <span class="tb-cursor blink" id="tb-cursor"></span>
    </div>

    <nav class="nav">
      <a href="../index.html">home</a>
      <a href="nbuntu.html">nbuntu</a>
      <a href="stash.html">nbh$tash</a>
      <a href="knitting.html">뜨개 공방</a>
      <a href="guestbook.html" class="active">방명록</a>
    </nav>

    <div class="content">

      <aside class="sidebar">
        <img class="profile-img" src="../profile.jpg" alt="nbh">
        <div class="profile-name">nbh</div>
        <div class="profile-bio">코드를 짜고<br>뜨개질을 합니다</div>
      </aside>

      <div class="main">
        <h1 class="page-header">방명록</h1>
        <p class="page-description">발자취를 남겨주세요</p>

        <!-- 방명록 카운터 -->
        <div class="gb-counter" id="gb-counter">
          <span class="gb-counter-icon">&#9993;</span>
          총 <strong id="gb-total">0</strong>개의 흔적
        </div>

        <!-- 방명록 작성 폼 -->
        <div class="gb-write">
          <div class="gb-write-header">
            <span class="gb-write-dot"></span>
            <span class="gb-write-dot"></span>
            <span class="gb-write-dot"></span>
            <span class="gb-write-title">글 남기기</span>
          </div>
          <div class="gb-write-body">
            <div class="gb-write-row">
              <div class="gb-field">
                <label for="guest-name">닉네임</label>
                <input type="text" id="guest-name" placeholder="이름을 알려주세요" maxlength="20">
              </div>
              <div class="gb-field gb-field-icon">
                <label for="guest-icon">아이콘</label>
                <div class="gb-icon-picker" id="gb-icon-picker">
                  <button type="button" class="gb-icon-btn selected" data-icon="🐶">🐶</button>
                  <button type="button" class="gb-icon-btn" data-icon="🐱">🐱</button>
                  <button type="button" class="gb-icon-btn" data-icon="🐰">🐰</button>
                  <button type="button" class="gb-icon-btn" data-icon="🐻">🐻</button>
                  <button type="button" class="gb-icon-btn" data-icon="🐸">🐸</button>
                  <button type="button" class="gb-icon-btn" data-icon="🌸">🌸</button>
                  <button type="button" class="gb-icon-btn" data-icon="⭐">⭐</button>
                  <button type="button" class="gb-icon-btn" data-icon="🎵">🎵</button>
                </div>
              </div>
            </div>
            <div class="gb-field">
              <label for="guest-message">한마디</label>
              <textarea id="guest-message" placeholder="하고 싶은 말을 적어주세요 :)" maxlength="500"></textarea>
              <div class="gb-char-count"><span id="gb-char-current">0</span>/500</div>
            </div>
            <button id="guest-submit" class="gb-submit-btn" onclick="submitGuestbook()">
              <span class="gb-submit-text">남기기 ✦</span>
            </button>
          </div>
        </div>

        <!-- 방명록 목록 -->
        <div class="gb-list" id="guestbook-list">
          <div class="notice-bar" id="firebase-notice">
            아직 Firebase가 연결되지 않았습니다. 연결하면 방명록이 동작합니다!
          </div>
        </div>

      </div>
    </div>

    <footer class="footer">
      &copy; 2026 nbh &middot; 이 홈페이지는 버그가 아니라 기능입니다
    </footer>

  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>

  <script src="../guestbook.js"></script>
  <script src="../script.js"></script>

  <script>
    /* ── 타이핑 바 애니메이션 ── */
    (function () {
      var TYPE_SPEED   = 75;
      var ENTER_DELAY  = 280;
      var RESULT_DELAY = 2200;
      var CLEAR_DELAY  = 350;

      var SEQ = [
        { cmd: 'touch guestbook.txt',   result: '발자취를 남겨주세요' },
        { cmd: 'echo "hello"',          result: '반갑습니다 :)' },
        { cmd: 'cat rules.txt',         result: '악플은… 마음이 아파요' },
        { cmd: 'chmod +w guest.log',    result: '누구나 쓸 수 있음' },
        { cmd: 'tail -1 mailbox/',      result: '편지를 기다리는 중' },
        { cmd: 'whoami',                result: '익명 방문자 환영' },
        { cmd: 'date',                  result: '방문 기록 남기기 좋은 날' },
      ];

      var elCmd    = document.getElementById('tb-cmd');
      var elOutput = document.getElementById('tb-output');
      var elCursor = document.getElementById('tb-cursor');
      if (!elCmd || !elOutput || !elCursor) return;
      var seqIdx = 0;

      function clearAll() {
        elCmd.textContent    = '';
        elOutput.textContent = '';
      }

      function startSequence() {
        var item = SEQ[seqIdx % SEQ.length];
        seqIdx++;
        clearAll();

        typeCommand(item.cmd, 0, function () {
          elCursor.classList.remove('blink');
          setTimeout(function () {
            elOutput.textContent = ' → ' + item.result;
            elCursor.classList.add('blink');
            setTimeout(function () {
              elCursor.classList.remove('blink');
              setTimeout(function () {
                elCursor.classList.add('blink');
                startSequence();
              }, CLEAR_DELAY);
            }, RESULT_DELAY);
          }, ENTER_DELAY);
        });
      }

      function typeCommand(text, charIdx, onDone) {
        if (charIdx > text.length) { onDone(); return; }
        elCmd.textContent = text.slice(0, charIdx);
        setTimeout(function () { typeCommand(text, charIdx + 1, onDone); }, TYPE_SPEED);
      }

      setTimeout(startSequence, 500);
    })();
  </script>
</body>
</html>
