// State: { itemKey: 'yes' | 'no' | 'later' | null }
let decisions = {};
const STORAGE_KEY = 'blog-upload-checklist';

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) decisions = JSON.parse(saved);
  } catch(e) {}
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
}

function itemKey(catIdx, itemIdx) {
  return `${catIdx}-${itemIdx}`;
}

function render() {
  const container = document.getElementById('checklist');
  container.innerHTML = '';

  data.forEach((cat, catIdx) => {
    const notUploadedCount = cat.items.filter(i => !i.uploaded).length;
    if (notUploadedCount === 0 && currentFilter !== 'all') return;

    const catDiv = document.createElement('div');
    catDiv.className = 'category';

    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `<h2>${cat.category}</h2><span class="badge">${notUploadedCount}개 미게시</span>`;
    catDiv.appendChild(header);

    const body = document.createElement('div');
    body.className = 'category-body';

    // Group by series
    const seriesMap = new Map();
    cat.items.forEach((item, itemIdx) => {
      const key = item.series || '__none__';
      if (!seriesMap.has(key)) seriesMap.set(key, []);
      seriesMap.get(key).push({ ...item, itemIdx });
    });

    seriesMap.forEach((items, seriesName) => {
      let wrapper = body;
      if (seriesName !== '__none__' && items.length > 1) {
        const seriesDiv = document.createElement('div');
        seriesDiv.className = 'series';
        const sh = document.createElement('div');
        sh.className = 'series-header';
        sh.textContent = seriesName + ` (${items.length}편)`;
        seriesDiv.appendChild(sh);
        body.appendChild(seriesDiv);
        wrapper = seriesDiv;
      }

      items.forEach(item => {
        const key = itemKey(catIdx, item.itemIdx);
        const decision = decisions[key] || null;

        // Filter
        if (currentFilter === 'undecided' && (item.uploaded || decision)) return;
        if (currentFilter === 'yes' && decision !== 'yes') return;
        if (currentFilter === 'no' && decision !== 'no') return;
        if (currentFilter === 'later' && decision !== 'later') return;

        const div = document.createElement('div');
        div.className = 'item' + (item.uploaded ? ' uploaded-item' : '');

        if (item.uploaded) {
          div.innerHTML = `
            <input type="checkbox" checked disabled>
            <span class="title">${item.title}</span>
            <span class="status uploaded">게시됨</span>
          `;
        } else {
          div.innerHTML = `
            <span class="title">${item.title}</span>
            <span class="status not-uploaded">미게시</span>
            <div class="decision">
              <button class="btn-yes ${decision === 'yes' ? 'selected' : ''}" onclick="decide('${key}','yes')">올림</button>
              <button class="btn-later ${decision === 'later' ? 'selected' : ''}" onclick="decide('${key}','later')">나중에</button>
              <button class="btn-no ${decision === 'no' ? 'selected' : ''}" onclick="decide('${key}','no')">안 올림</button>
            </div>
          `;
        }

        wrapper.appendChild(div);
      });
    });

    catDiv.appendChild(body);
    container.appendChild(catDiv);
  });

  updateStats();
}

let currentFilter = 'all';
function filterItems(filter) {
  currentFilter = filter;
  document.querySelectorAll('.controls button').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
  render();
}

function decide(key, value) {
  if (decisions[key] === value) {
    delete decisions[key];
  } else {
    decisions[key] = value;
  }
  saveState();
  render();
}

function updateStats() {
  let total = 0, yes = 0, no = 0, later = 0, undecided = 0;
  data.forEach((cat, catIdx) => {
    cat.items.forEach((item, itemIdx) => {
      if (item.uploaded) return;
      total++;
      const d = decisions[itemKey(catIdx, itemIdx)];
      if (d === 'yes') yes++;
      else if (d === 'no') no++;
      else if (d === 'later') later++;
      else undecided++;
    });
  });
  document.getElementById('total-count').textContent = total;
  document.getElementById('yes-count').textContent = yes;
  document.getElementById('no-count').textContent = no;
  document.getElementById('later-count').textContent = later;
  document.getElementById('undecided-count').textContent = undecided;
}

function exportResult() {
  let result = '=== 블로그 업로드 결정 결과 ===\n\n';

  const groups = { yes: '## 올릴 글\n', later: '## 나중에\n', no: '## 안 올림\n' };

  Object.keys(groups).forEach(type => {
    let lines = [];
    data.forEach((cat, catIdx) => {
      cat.items.forEach((item, itemIdx) => {
        if (item.uploaded) return;
        if (decisions[itemKey(catIdx, itemIdx)] === type) {
          lines.push(`- [${cat.category}] ${item.title}`);
        }
      });
    });
    if (lines.length > 0) {
      result += groups[type] + lines.join('\n') + '\n\n';
    }
  });

  // undecided
  let undecided = [];
  data.forEach((cat, catIdx) => {
    cat.items.forEach((item, itemIdx) => {
      if (item.uploaded) return;
      if (!decisions[itemKey(catIdx, itemIdx)]) {
        undecided.push(`- [${cat.category}] ${item.title}`);
      }
    });
  });
  if (undecided.length > 0) {
    result += '## 미결정\n' + undecided.join('\n') + '\n';
  }

  const el = document.getElementById('export-result');
  el.textContent = result;
  el.style.display = 'block';
}

loadState();
render();
</script>
